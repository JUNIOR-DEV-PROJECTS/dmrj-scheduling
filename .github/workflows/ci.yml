name: Verificação do projeto

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Instalar dependências e compilar
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm install

      - name: Verificar compilação de produção
        run: npm run build
